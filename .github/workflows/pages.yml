name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html app.js projects.js layout-core.js editor.html editor.js style.css start.css editor.css portfolio-pages.css .nojekyll mist-train-concept.html _site/
          unzip -q assets.zip -d _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
