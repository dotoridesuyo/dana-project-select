<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>김단아 포트폴리오 · 화면 편집</title><link rel="stylesheet" href="editor.css"><script src="layout-core.js?v=20261031-r146" defer></script><script src="editor.js" defer></script></head>
<body>
  <header class="editor-header"><div class="editor-brand"><span aria-hidden="true">✧</span><div><strong>화면 편집</strong><small>김단아 포트폴리오 · PC 레이아웃</small></div></div><div class="editor-actions"><button id="undo" disabled>↶ 되돌리기</button><button id="redo" disabled>↷ 다시 실행</button><button id="preview-toggle" aria-pressed="false">미리보기</button><button id="save-layout" class="primary">이 브라우저에 저장</button><a href="index.html" target="_blank" rel="noopener">사이트 열기 ↗</a></div></header>
  <div class="workbench">
    <section class="canvas-column" aria-label="사이트 편집 화면">
      <div class="canvas-toolbar"><label>화면 <select id="scene-select"><option value="projects">소개·프로젝트</option><option value="start">시작 버튼</option><option value="greeting">인사말</option></select></label><button id="play-intro">▷ 전환 재생</button><label>작품 <select id="project-select"><option value="0">01 안개 열차</option><option value="1">02 시즌 이벤트</option><option value="2">03 흑련</option><option value="3">04 돌아온 미식가</option><option value="4">05 리프</option><option value="5">06 연우</option></select></label></div>
      <div class="canvas-subbar"><div><label>크기 <select id="viewport-select"><option value="1440,900">PC 1440</option><option value="1920,1080">큰 PC 1920</option><option value="1280,800">노트북 1280</option><option value="1024,900">작은 화면 1024</option><option value="390,844">모바일 390 · 미리보기</option></select></label><label>확대 <select id="zoom-select"><option value="fit">화면에 맞춤</option><option value="0.75">75%</option><option value="1">100%</option></select></label></div><label class="snap-label"><input id="snap-grid" type="checkbox"> 8px 맞춤</label><span id="zoom-label"></span></div>
      <p class="canvas-hint" id="canvas-hint">글자를 클릭해 선택하고 드래그하세요. 테두리의 손잡이로 크기를 조절할 수 있습니다.</p>
      <div class="canvas-scroll" id="canvas-scroll"><div class="preview-positioner" id="preview-positioner"><iframe id="editor-preview" title="포트폴리오 화면 미리보기" src="index.html?layoutPreview=1"></iframe></div><p id="loading">미리보기를 불러오는 중입니다…</p></div>
      <div class="editor-status"><output id="editor-status" role="status">저장한 PC 레이아웃을 불러옵니다.</output><span id="dirty-indicator">저장됨</span></div>
    </section>
    <aside class="inspector" aria-label="레이아웃 설정">
      <section class="inspector-section"><p class="section-kicker">선택 요소</p><label class="sr-only" for="element-select">편집할 요소</label><select id="element-select"></select><p class="selection-help" id="selection-help">화면의 글자나 영역을 클릭해 선택하세요.</p><label class="scope-label" id="scope-wrap" hidden>적용 범위 <select id="scope-select"><option value="common">모든 작품에 공통</option><option value="project">현재 작품만</option></select></label><fieldset id="node-fields" disabled>
        <div class="field-pair"><label>가로 위치 X <input id="node-x" data-property="x" type="number" min="-800" max="800" step="1"><span>px</span></label><label>세로 위치 Y <input id="node-y" data-property="y" type="number" min="-800" max="800" step="1"><span>px</span></label></div>
        <label class="font-control">글자 크기 <div><input id="font-slider" aria-label="글자 크기 슬라이더" type="range" min="8" max="180" step="1"><input id="node-fontSize" aria-label="글자 크기 숫자" data-property="fontSize" type="number" min="8" max="180" step="1"><span>px</span></div></label>
        <div class="field-pair"><label>줄 간격 <input id="node-lineHeight" data-property="lineHeight" type="number" min=".6" max="4" step=".05"><span>배</span></label><label>글자 간격 <input id="node-letterSpacing" data-property="letterSpacing" type="number" min="-5" max="30" step=".1"><span>px</span></label></div>
        <div class="field-pair"><label>너비 <input id="node-width" data-property="width" type="number" min="0" max="1800" step="1"><span>0 = 자동</span></label><label id="height-field">높이 <input id="node-height" data-property="height" type="number" min="0" max="1200" step="1"><span>0 = 자동</span></label></div>
      </fieldset><button id="reset-node" class="subtle" disabled>선택 요소 기본값</button><p class="small-help">드래그로 이동 · 모서리 손잡이로 크기 조절<br>방향키로 1px 이동 · Shift와 함께 10px</p></section>
      <section class="inspector-section"><details open><summary>PC 전체 배치</summary><fieldset id="global-fields"></fieldset></details></section>
      <section class="inspector-section file-section"><p class="section-kicker">설정 파일</p><div class="file-buttons"><button id="export-layout">설정 내보내기</button><button id="import-layout">설정 불러오기</button></div><input type="file" id="import-file" accept=".json,application/json" hidden><p class="storage-note">저장한 변경은 <strong>현재 브라우저에만</strong> 보입니다. 다른 PC에서 쓰거나 공개본에 반영하려면 설정 파일을 내보내 보관·전달하세요.</p><button id="reset-all" class="subtle">전체 기본값으로 되돌리기</button></section>
    </aside>
  </div>
</body></html>
